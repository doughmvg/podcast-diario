name: Gerar Podcast Diário - Claudião News

# Quando executar
on:
  # Todo dia às 9h UTC (6h BRT)
  schedule:
    - cron: '0 9 * * *'
  
  # Permite rodar manualmente
  workflow_dispatch:

# Permissões necessárias
permissions:
  contents: write

jobs:
  gerar-podcast:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout do código
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      # 2. Configurar Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # 3. Instalar dependências
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # 4. Gerar o podcast
      - name: 🎙️ Gerar podcast
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          python podcast_bot.py
      
      # 5. Listar arquivos gerados (debug)
      - name: 📋 Verificar arquivos gerados
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 Arquivos .txt gerados:"
          ls -lh podcast_*.txt 2>/dev/null || echo "  ⚠️ Nenhum .txt encontrado"
          echo ""
          echo "📁 Arquivos .json gerados:"
          ls -lh podcast_*.json 2>/dev/null || echo "  ⚠️ Nenhum .json encontrado"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      # 6. Upload como Artifacts (para download)
      - name: 📤 Upload dos arquivos (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: claudiao-news-${{ github.run_number }}
          path: |
            podcast_*.txt
            podcast_*.json
          if-no-files-found: error
          retention-days: 90
      
      # 7. Commit dos arquivos no repositório
      - name: 💾 Salvar no repositório
        run: |
          # Criar pasta podcasts se não existir
          mkdir -p podcasts
          
          # Mover arquivos
          mv podcast_*.txt podcasts/ 2>/dev/null || echo "Sem .txt para mover"
          mv podcast_*.json podcasts/ 2>/dev/null || echo "Sem .json para mover"
          
          # Configurar git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Claudião News Bot"
          
          # Adicionar arquivos
          git add podcasts/
          
          # Commit (apenas se houver mudanças)
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commit"
          else
            git commit -m "🎙️ Podcast gerado em $(date +'%d/%m/%Y às %H:%M')"
            git push
            echo "✅ Arquivos commitados com sucesso!"
          fi
      
      # 8. Resumo final
      - name: 📊 Resumo da execução
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎙️  CLAUDIÃO NEWS - RELATÓRIO"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 Data: $(date +'%d/%m/%Y')"
          echo "🕐 Hora: $(date +'%H:%M:%S')"
          echo "🔢 Run: #${{ github.run_number }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ -f "podcasts/podcast_metadados_$(date +'%Y-%m-%d').json" ]; then
            echo "✅ Status: SUCESSO"
            echo ""
            echo "📁 Arquivos salvos em:"
            echo "   • Actions Artifacts (baixe na aba Actions)"
            echo "   • Pasta /podcasts no repositório"
          else
            echo "❌ Status: FALHA"
            echo "   Verifique os logs acima"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
